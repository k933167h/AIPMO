services:
  api:
    build: .
    environment:
      PMO_API_KEY: ${PMO_API_KEY:?Set PMO_API_KEY in .env}
      DATABASE_URL: postgresql+psycopg://pmo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/pmo
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmo
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pmo_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmo -d pmo']
      interval: 5s
      retries: 10
volumes:
  pmo_db:
